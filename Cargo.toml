[package]
name = "chuanhoa-vb-pro"
version = "1.0.0"
edition = "2021"
description = "MonWord — Chuẩn Hóa Văn Bản Pro (Hệ sinh thái văn phòng Mon)"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
windows-registry = "0.6"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
